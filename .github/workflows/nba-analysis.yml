name: NBA Analysis Run
on:
  push:
    branches: [nba-analysis-run]
  workflow_dispatch:
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy pyarrow requests statsmodels
      - run: python scratch/nba_analysis.py
      - uses: actions/upload-artifact@v4
        with:
          name: nba-analysis-output
          path: nba_outputs/
